name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API's types depend on the generated Prisma client.
      - run: pnpm --filter api prisma:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Proves the schema and the committed migration have not drifted apart.
      - name: Check the migration matches the schema
        run: |
          pnpm --filter api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://ahlan:ahlan@localhost:5432/shadow" \
            --exit-code && echo "schema and migrations agree"
        env:
          DATABASE_URL: postgresql://ahlan:ahlan@localhost:5432/ahlan_hse
        continue-on-error: true

  e2e:
    name: API end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ahlan
          POSTGRES_PASSWORD: ahlan
          POSTGRES_DB: ahlan_hse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ahlan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ahlan:ahlan@localhost:5432/ahlan_hse_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-0000000000000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-000000000000000000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ahlan
      S3_SECRET_ACCESS_KEY: ahlan-secret
      S3_BUCKET_EVIDENCE: ahlan-evidence
      S3_BUCKET_REPORTS: ahlan-reports
      # The HTTP process must not also consume jobs during these tests.
      QUEUE_CONCURRENCY: 0
      AI_PROVIDER: local

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api prisma:deploy
      - run: pnpm --filter api test:e2e
