# Local development dependencies for Ahlan HSE.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: ahlan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahlan
      POSTGRES_PASSWORD: ahlan
      POSTGRES_DB: ahlan_hse
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ahlan -d ahlan_hse']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ahlan-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ahlan-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ahlan
      MINIO_ROOT_PASSWORD: ahlan-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the evidence bucket on first boot so presigned uploads work immediately.
  minio-init:
    image: minio/mc:latest
    container_name: ahlan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ahlan ahlan-secret &&
      mc mb --ignore-existing local/ahlan-evidence &&
      mc mb --ignore-existing local/ahlan-reports &&
      echo 'buckets ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: ahlan-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
