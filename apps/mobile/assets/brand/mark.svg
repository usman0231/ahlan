<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ahlan mark: a geometric "A" (roof apex / stadium) crossed by a hi-vis
       band. Same geometry as LogoMark in src/components/brand.tsx. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2026"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#tile)"/>
  <rect width="64" height="64" rx="18" fill="url(#sheen)"/>
  <path d="M17 49 L32 15 L47 49" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="13" y1="37" x2="51" y2="37" stroke="#0B0C0E" stroke-width="9" stroke-linecap="round"/>
  <line x1="13" y1="37" x2="51" y2="37" stroke="#C6F432" stroke-width="5" stroke-linecap="round"/>
</svg>
